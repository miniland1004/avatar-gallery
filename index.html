<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatar Gallery</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Avatar Gallery</h1>
          <p id="itemCount">아이템 불러오는 중</p>
        </div>
      </div>
      <label class="search-box">
        <span>검색</span>
        <input id="searchInput" type="search" inputmode="numeric" autocomplete="off" placeholder="아이템 ID">
      </label>
    </header>

    <main class="app-shell">
      <section class="viewer-panel" aria-label="모션 미리보기">
        <div class="viewer-heading">
          <div>
            <p class="eyebrow">선택 아이템</p>
            <h2 id="selectedTitle">-</h2>
          </div>
          <span id="selectedKind" class="kind-pill">-</span>
        </div>

        <div id="spriteStage" class="sprite-stage" aria-live="polite"></div>

        <div class="control-grid">
          <label>
            <span>움직임</span>
            <select id="moveSelect"></select>
          </label>
          <label>
            <span>공격</span>
            <select id="attackSelect"></select>
          </label>
        </div>

        <div class="player-row">
          <button id="playButton" class="icon-button" type="button" aria-label="재생/정지" title="재생/정지">||</button>
          <button id="prevButton" class="icon-button" type="button" aria-label="이전 프레임" title="이전 프레임">&lt;</button>
          <button id="nextButton" class="icon-button" type="button" aria-label="다음 프레임" title="다음 프레임">&gt;</button>
          <label class="speed-control">
            <span>속도</span>
            <input id="speedRange" type="range" min="70" max="420" step="10" value="150">
          </label>
          <span id="frameLabel" class="frame-label">0 / 0</span>
        </div>
      </section>

      <section class="gallery-panel" aria-label="아이템 목록">
        <div class="filter-row" id="filterRow"></div>
        <div id="galleryGrid" class="gallery-grid"></div>
        <p id="emptyState" class="empty-state" hidden>검색 결과가 없습니다.</p>
      </section>
    </main>

    <script src="assets/manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
